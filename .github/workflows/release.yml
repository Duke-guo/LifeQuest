name: Release

# 打一个形如 v0.1.0 的 tag 就会自动：
#   1. 编译 + 打包 Windows 便携版
#   2. 建一个 Release，把便携版 exe 作为下载附件传上去
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 打包便携版
        env:
          # 让 electron-builder 在 CI 上不尝试签名（没有证书）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-vite build && npx electron-builder --win portable --publish never

      - name: 上传构建产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: LifeQuest-windows-portable
          path: release/*.exe

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          generate_release_notes: true
          body: |
            下载下面的 `LifeQuest-*-便携版.exe`，双击即可运行（免安装）。

            数据会存放在 exe 同级的 `LifeQuest-Data/` 文件夹里，整个文件夹拷走就是完整备份。
            Windows 可能提示「未知发布者」（个人项目未购买代码签名证书），选择「更多信息 → 仍要运行」即可。

            详细说明见 [README](https://github.com/${{ github.repository }}#下载即用windows)。
