name: Release

# 触发方式：
#   1) 打 tag（形如 v0.1.0）→ 自动构建三平台安装包，并建 Release 上传附件
#   2) 手动（Actions 页 → Run workflow）→ 只构建并上传 Artifacts，方便先试跑
#
# 排查用：任何一个打包步骤失败时，会把日志里的报错行写成「注解」，
# 注解可以通过公开 API 读到（不需要登录），便于远程定位问题。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 便携版
            os: windows-latest
            artifact: LifeQuest-windows
            glob: |
              release/*.exe
          - name: macOS (dmg + zip)
            os: macos-latest
            artifact: LifeQuest-macos
            glob: |
              release/*.dmg
              release/*.zip
          - name: Linux (AppImage + deb)
            os: ubuntu-latest
            artifact: LifeQuest-linux
            glob: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # AppImage 相关工具依赖 FUSE；Ubuntu 24.04 里包名是 libfuse2t64
      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot xz-utils squashfs-tools libarchive-tools || true
          sudo apt-get install -y -qq libfuse2 || sudo apt-get install -y -qq libfuse2t64 || true

      - name: 类型检查
        run: npm run typecheck

      - name: 编译（Vite）
        run: npx electron-vite build

      # ---------- 打包：每个平台一步，失败不中断，便于把日志抓出来 ----------
      - name: 打包 · Windows
        id: pack-win
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p ci-logs
          npx electron-builder --win portable --publish never 2>&1 | tee ci-logs/pack.log
          exit ${PIPESTATUS[0]}

      - name: 打包 · macOS
        id: pack-mac
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p ci-logs
          # 用 --x64 --arm64 明确构建两种芯片（命令行 arch 会覆盖配置里的 arch）
          npx electron-builder --mac --x64 --arm64 --publish never 2>&1 | tee ci-logs/pack.log
          exit ${PIPESTATUS[0]}

      - name: 打包 · Linux AppImage
        id: pack-appimage
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p ci-logs
          npx electron-builder --linux AppImage --publish never 2>&1 | tee ci-logs/pack.log
          exit ${PIPESTATUS[0]}

      - name: 打包 · Linux deb
        id: pack-deb
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --linux deb --publish never 2>&1 | tee -a ci-logs/pack.log
          exit ${PIPESTATUS[0]}

      # ---------- 把失败原因做成公开可读的注解 ----------
      - name: 记录失败原因（注解）
        if: >-
          always() && hashFiles('ci-logs/pack.log') != '' &&
          (steps.pack-win.outcome == 'failure' || steps.pack-mac.outcome == 'failure' ||
           steps.pack-appimage.outcome == 'failure' || steps.pack-deb.outcome == 'failure')
        shell: bash
        run: |
          set +e
          ERR=$(grep -inE "error|cannot|failed|not found|no such|ENOENT|Please install|denied|✗|Error:|stackTrace" ci-logs/pack.log | tail -n 8 | tr '\n' '|' | tr -d '\r' | cut -c1-2500)
          if [ -z "$ERR" ]; then ERR=$(tail -n 12 ci-logs/pack.log | tr '\n' '|' | tr -d '\r' | cut -c1-2500); fi
          echo "== 报错摘录 =="
          echo "$ERR" | tr '|' '\n' | tail -n 8
          echo "::error title=打包失败原因::$ERR"

      - name: 如果有打包失败就让任务失败
        if: steps.pack-win.outcome == 'failure' || steps.pack-mac.outcome == 'failure' || steps.pack-appimage.outcome == 'failure' || steps.pack-deb.outcome == 'failure'
        run: |
          echo "至少一个打包步骤失败，见上面的注解"
          exit 1

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 | 说明 |
            |---|---|---|
            | Windows | `LifeQuest-*-portable.exe` | 免安装，双击即用 |
            | macOS (Intel) | `LifeQuest-*-mac-x64.dmg` | 打开后拖进「应用程序」 |
            | macOS (Apple 芯片) | `LifeQuest-*-mac-arm64.dmg` | 打开后拖进「应用程序」 |
            | Linux | `LifeQuest-*-linux-x86_64.AppImage` | `chmod +x` 后直接运行 |

            **数据位置**：Windows 在 exe 同级的 `LifeQuest-Data/`；macOS 在「文稿」目录下的 `LifeQuest-Data/`；Linux 在 AppImage 同级的 `LifeQuest-Data/`。整个文件夹拷走就是完整备份。

            **关于系统安全提示**（个人项目，未购买代码签名证书）：
            - Windows：「未知发布者」→ 更多信息 → 仍要运行
            - macOS：右键 App → 打开；若提示已损坏，执行 `xattr -cr /Applications/LifeQuest.app`
            - Linux AppImage 若报沙箱错误，用 `--no-sandbox` 启动

            详细说明见 [README](https://github.com/${{ github.repository }}#readme)。
