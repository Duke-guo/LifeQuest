name: Release

# 触发方式：
#   1) 打 tag（形如 v0.1.0）→ 自动构建三平台安装包，并建 Release 上传附件
#   2) 手动（Actions 页 → Run workflow）→ 只构建并上传 Artifacts，方便先试跑
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 便携版
            os: windows-latest
            command: npx electron-builder --win portable --publish never
            artifact: LifeQuest-windows
            glob: |
              release/*.exe
          - name: macOS (dmg + zip)
            os: macos-latest
            command: npx electron-builder --mac dmg zip --publish never
            artifact: LifeQuest-macos
            glob: |
              release/*.dmg
              release/*.zip
          - name: Linux (AppImage + deb)
            os: ubuntu-latest
            command: npx electron-builder --linux AppImage deb --publish never
            artifact: LifeQuest-linux
            glob: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # AppImage 的打包工具（appimagetool）自己就是个 AppImage，需要 FUSE 才能跑；
      # GitHub 的 Ubuntu runner 默认没有，装一下；装不上也没关系，下一步会用解包模式兜底。
      # Ubuntu 24.04 里包名是 libfuse2t64，所以两条都试。
      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot xz-utils libarchive-tools || true
          sudo apt-get install -y -qq libfuse2 || sudo apt-get install -y -qq libfuse2t64 || true

      - name: 类型检查
        run: npm run typecheck

      - name: 编译（Vite）
        run: npx electron-vite build

      - name: 打包
        env:
          # 个人项目没有代码签名证书：让 electron-builder 不要去找证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 没有 FUSE 时，让 AppImage 相关的工具改成「解包运行」
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # 万一还是失败，日志里能看到细节
          DEBUG: ${{ runner.os == 'Linux' && 'electron-builder' || '' }}
        run: ${{ matrix.command }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: 建 Release 并上传附件
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            ## 下载

            | 系统 | 文件 | 说明 |
            |---|---|---|
            | Windows | `LifeQuest-*-便携版.exe` | 免安装，双击即用 |
            | macOS | `LifeQuest-*-mac-*.dmg` | 打开后把 LifeQuest 拖进「应用程序」 |
            | Linux | `LifeQuest-*-linux-x86_64.AppImage` | `chmod +x` 后直接运行 |

            **数据位置**：Windows 在 exe 同级的 `LifeQuest-Data/`；macOS 在「文稿」目录下的 `LifeQuest-Data/`；Linux 在 AppImage 同级的 `LifeQuest-Data/`。整个文件夹拷走就是完整备份。

            **关于系统安全提示**（个人项目，未购买代码签名证书）：
            - Windows：「未知发布者」→ 更多信息 → 仍要运行
            - macOS：右键 App → 打开；若提示已损坏，执行 `xattr -cr /Applications/LifeQuest.app`
            - Linux AppImage 若报沙箱错误，用 `--no-sandbox` 启动

            详细说明见 [README](https://github.com/${{ github.repository }}#readme)。
